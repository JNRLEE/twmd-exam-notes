<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" role="img" aria-labelledby="title desc">
  <title id="title">Neck lymph node levels I to VII</title>
  <desc id="desc">Original schematic showing cervical lymph node levels I through VII.</desc>
  <defs>
    <style>
      .outline { fill: #f8fafc; stroke: #334155; stroke-width: 3; }
      .bone { fill: none; stroke: #64748b; stroke-width: 5; stroke-linecap: round; }
      .label { font: 700 24px -apple-system，BlinkMacSystemFont，"Segoe UI"，sans-serif; fill: #0f172a; }
      .small { font: 500 16px -apple-system，BlinkMacSystemFont，"Segoe UI"，sans-serif; fill: #334155; }
      .caption { font: 600 18px -apple-system，BlinkMacSystemFont，"Segoe UI"，sans-serif; fill: #0f172a; }
      .level { stroke: #ffffff; stroke-width: 3; opacity: .92; }
      .line { stroke: #0f172a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0，0 L8，4 L0，8 Z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="820" height="620" fill="#ffffff"/>
  <text x="40" y="46" class="caption">Head and neck lymph node levels</text>
  <text x="40" y="73" class="small">Simplified lateral map for exam review. Boundaries are schematic，not an imaging contour.</text>

  <!-- head and neck silhouette -->
  <path class="outline" d="M365 92
    C326 100 296 130 288 169
    C279 214 300 255 337 274
    C344 297 345 317 338 340
    C320 393 286 433 252 470
    L553 470
    C516 433 487 391 474 340
    C468 317 470 296 480 274
    C514 252 532 214 524 174
    C515 128 477 95 431 91
    C413 73 384 74 365 92 Z"/>

  <!-- mandible，hyoid，cricoid，clavicle -->
  <path class="bone" d="M317 246 C360 275 438 276 486 247"/>
  <path class="bone" d="M334 322 L491 322"/>
  <path class="bone" d="M335 376 L492 376"/>
  <path class="bone" d="M245 472 C330 488 476 488 566 472"/>
  <text x="588" y="477" class="small">clavicle</text>
  <text x="506" y="326" class="small">hyoid</text>
  <text x="506" y="380" class="small">cricoid</text>

  <!-- node level regions -->
  <path class="level" fill="#a7f3d0" d="M356 246 C381 259 421 260 449 248 L438 312 L367 312 Z"/>
  <path class="level" fill="#6ee7b7" d="M300 247 C322 269 345 286 367 312 L333 322 C302 303 286 279 285 258 Z"/>
  <path class="level" fill="#93c5fd" d="M455 250 C483 264 500 292 495 323 L442 323 L438 312 Z"/>
  <path class="level" fill="#60a5fa" d="M439 323 L497 323 L497 376 L431 376 Z"/>
  <path class="level" fill="#3b82f6" d="M431 376 L497 376 L532 466 L441 466 Z"/>
  <path class="level" fill="#fbbf24" d="M300 302 C318 330 333 353 340 378 C350 417 346 448 324 466 L247 466 C286 423 319 390 333 322 Z"/>
  <path class="level" fill="#fb923c" d="M341 323 L431 323 L441 466 L324 466 C348 439 351 406 340 378 Z"/>
  <path class="level" fill="#f87171" d="M344 469 L466 469 L490 560 L314 560 Z"/>

  <!-- labels in map -->
  <text x="389" y="290" class="label">IA</text>
  <text x="309" y="288" class="label">IB</text>
  <text x="459" y="300" class="label">II</text>
  <text x="458" y="357" class="label">III</text>
  <text x="466" y="426" class="label">IV</text>
  <text x="285" y="388" class="label">V</text>
  <text x="374" y="404" class="label">VI</text>
  <text x="377" y="527" class="label">VII</text>

  <!-- legend -->
  <g transform="translate(610 120)">
    <text x="0" y="0" class="caption">Memory map</text>
    <rect x="0" y="24" width="22" height="22" fill="#a7f3d0"/><text x="34" y="42" class="small">IA: submental</text>
    <rect x="0" y="58" width="22" height="22" fill="#6ee7b7"/><text x="34" y="76" class="small">IB: submandibular</text>
    <rect x="0" y="92" width="22" height="22" fill="#93c5fd"/><text x="34" y="110" class="small">II: upper jugular</text>
    <rect x="0" y="126" width="22" height="22" fill="#60a5fa"/><text x="34" y="144" class="small">III: middle jugular</text>
    <rect x="0" y="160" width="22" height="22" fill="#3b82f6"/><text x="34" y="178" class="small">IV: lower jugular</text>
    <rect x="0" y="194" width="22" height="22" fill="#fbbf24"/><text x="34" y="212" class="small">V: posterior triangle</text>
    <rect x="0" y="228" width="22" height="22" fill="#fb923c"/><text x="34" y="246" class="small">VI: central neck</text>
    <rect x="0" y="262" width="22" height="22" fill="#f87171"/><text x="34" y="280" class="small">VII: superior mediastinum</text>
  </g>
</svg>
